<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinning Wheel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="confetti-container" class="confetti-container"></div>
  <main>
    <h1>Spin the Wheel</h1>
    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <div class="controls">
      <button id="spin-btn">Spin</button>
      <button id="auto-pick-btn">Auto Pick All</button>
      <button id="import-btn">Import Names</button>
      <span class="download-group">
        <button id="download-btn">Download Picked List</button>
        <select id="download-format" aria-label="Download format">
          <option value="txt">.txt</option>
          <option value="csv">.csv</option>
          <option value="xlsx">.xlsx</option>
          <option value="pdf">.pdf</option>
        </select>
      </span>
      <input type="file" id="import-input" accept=".txt,.csv,.xlsx" hidden>
    </div>
    <p class="hint">
      Import a <code>.txt</code>, <code>.csv</code>, or <code>.xlsx</code> file.
      For text/CSV: one name per line (or separated by commas), e.g.
      <code>Alice, Bob, Charlie</code>. For Excel: one name per cell on the first sheet.
    </p>

    <p id="result"></p>

    <section class="picked-section">
      <h2>Picked Order</h2>
      <ol id="picked-list"></ol>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="script.js"></script>
</body>
</html>
